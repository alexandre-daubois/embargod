name: Embargod
description: First-pass LLM triage of new GitHub security advisories, posted as an advisory comment.
author: Alexandre Daubois
branding:
  icon: shield
  color: orange

inputs:
  since:
    description: Only advisories created after this date (2026-10-22 or RFC 3339) are triaged. Required unless `advisory` is set.
    required: false
  advisory:
    description: Triage this GHSA only, whatever its state and creation date.
    required: false
  engine:
    description: LLM provider, `claude` or `openai`.
    default: claude
  model:
    description: Model id, defaults to claude-opus-5-5 or gpt-5.5 depending on the engine.
    required: false
  api-key:
    description: API key of the LLM provider.
    required: true
  bot-login:
    description: Login the comments are posted as, required with a GitHub App token, e.g. `my-app[bot]`. Found through the token otherwise.
    required: false
  github-token:
    description: Token able to read and comment the repository advisories.
    required: true
  repository:
    description: Repository owning the advisories.
    default: ${{ github.repository }}
  path:
    description: Path of the repository checkout, relative to the workspace.
    default: .
  daybreak:
    description: Turn on OpenAI's Daybreak cyber access program in Codex, with `engine: openai` only. The API key's org must be approved for it.
    default: "false"
  runner-image:
    description: Image the agent runs in, instead of the embargod agent image pinned by digest and checked against its build attestation. It needs the agent CLI, git, curl and harness-proxy, and is not checked.
    required: false

runs:
  # The agent runs in its own hardened container, so embargod itself runs on the runner, next to Docker.
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum
    - name: Build embargod
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -trimpath -o "$RUNNER_TEMP/embargod" ./cmd/embargod
    # The default images are pinned by digest. This checks they were built by embargod's own workflow.
    - name: Verify the agent image
      if: inputs.runner-image == ''
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        ENGINE: ${{ inputs.engine }}
        GH_TOKEN: ${{ github.token }}
      run: |
        case "$ENGINE" in openai) agent=codex ;; *) agent=claude ;; esac
        image=$(jq -er --arg agent "$agent" '.[$agent]' internal/sandbox/images.json)
        gh attestation verify "oci://$image" --repo alexandre-daubois/embargod --signer-workflow alexandre-daubois/embargod/.github/workflows/agent-image.yml
    - name: Triage
      shell: bash
      run: '"$RUNNER_TEMP/embargod"'
      env:
        SINCE: ${{ inputs.since }}
        ADVISORY: ${{ inputs.advisory }}
        ENGINE: ${{ inputs.engine }}
        MODEL: ${{ inputs.model }}
        LLM_API_KEY: ${{ inputs.api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        BOT_LOGIN: ${{ inputs.bot-login }}
        REPOSITORY: ${{ inputs.repository }}
        REPO_PATH: ${{ inputs.path }}
        RUNNER_IMAGE: ${{ inputs.runner-image }}
        DAYBREAK: ${{ inputs.daybreak }}
