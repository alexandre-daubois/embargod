name: Tamis
description: First-pass LLM triage of new GitHub security advisories, posted as an advisory comment.
author: Alexandre Daubois
branding:
  icon: shield
  color: orange

inputs:
  since:
    description: Only advisories created after this date (2026-10-22 or RFC 3339) are triaged. Required unless `advisory` is set.
    required: false
  advisory:
    description: Triage this GHSA only, whatever its state and creation date.
    required: false
  engine:
    description: LLM provider, `claude` or `openai`.
    default: claude
  model:
    description: Model id, defaults to claude-opus-5-5, gpt-5.5, or gpt-6.1-sol with a Codex access token.
    required: false
  api-key:
    description: API key of the LLM provider. With `engine: openai`, a Codex access token (`at-...`) works too.
    required: true
  bot-login:
    description: Login the comments are posted as, required with a GitHub App token, e.g. `my-app[bot]`. Found through the token otherwise.
    required: false
  github-token:
    description: Token able to read and comment the repository advisories.
    required: true
  repository:
    description: Repository owning the advisories.
    default: ${{ github.repository }}
  path:
    description: Path of the repository checkout, relative to the workspace.
    default: .
  daybreak:
    description: Turn on OpenAI's Daybreak cyber access program in Codex, with `engine: openai` only. The API key's org must be approved for it.
    default: "false"
  runner-image:
    description: Image the agent runs in, instead of the tamis agent image pinned by digest and checked against its build attestation. It needs the agent CLI, git, curl and harness-proxy, and is not checked.
    required: false
  references:
    description: Whitespace-separated local git references to analyse, including each supported release branch. All must have been fetched.
    required: true

runs:
  # The agent runs in its own hardened container, so tamis itself runs on the runner, next to Docker.
  using: composite
  steps:
    - name: Check deployment
      shell: bash
      env:
        PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        if [[ "$PRIVATE_REPOSITORY" != true ]]; then
          echo 'Tamis requires a private workflow repository.' >&2
          exit 1
        fi
        if [[ ! "$ACTION_REF" =~ ^[a-fA-F0-9]{40}$ ]]; then
          echo 'Pin Tamis to a reviewed full commit SHA.' >&2
          exit 1
        fi
    - name: Prepare private reports
      id: reports
      shell: bash
      run: printf 'path=%s\n' "$(mktemp -d "$RUNNER_TEMP/tamis-reports.XXXXXX")" >> "$GITHUB_OUTPUT"
    # A ref pointing at a release runs its attested binary, any other ref is built from source.
    - name: Download tamis
      id: download
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.action_repository }}
        REF: ${{ github.action_ref }}
        ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail
        case "$ARCH" in X64) arch=amd64 ;; ARM64) arch=arm64 ;; *) exit 0 ;; esac
        sha=$(gh api "repos/$REPO/commits/$REF" --jq .sha) || exit 0
        tags=$(gh api --paginate "repos/$REPO/tags" --jq ".[] | select(.commit.sha == \"$sha\") | .name") || exit 0
        tag=$(grep -m1 -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tags") || exit 0
        gh release download "$tag" --repo "$REPO" --pattern "tamis-linux-$arch" --output "$RUNNER_TEMP/tamis" --clobber || exit 0
        gh attestation verify "$RUNNER_TEMP/tamis" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/release.yml" --source-digest "$sha"
        chmod +x "$RUNNER_TEMP/tamis"
        echo "binary=true" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: steps.download.outputs.binary != 'true'
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum
    - name: Build tamis
      if: steps.download.outputs.binary != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -trimpath -o "$RUNNER_TEMP/tamis" ./cmd/tamis
    # The default images are pinned by digest. This checks they were built by tamis's own workflow.
    - name: Verify the agent image
      if: inputs.runner-image == ''
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        ENGINE: ${{ inputs.engine }}
        GH_TOKEN: ${{ github.token }}
      run: |
        case "$ENGINE" in openai) agent=codex ;; *) agent=claude ;; esac
        image=$(jq -er --arg agent "$agent" '.[$agent]' internal/sandbox/images.json)
        gh attestation verify "oci://$image" --repo alexandre-daubois/embargod --signer-workflow alexandre-daubois/embargod/.github/workflows/agent-image.yml
    - name: Triage
      id: triage
      shell: bash
      run: '"$RUNNER_TEMP/tamis"'
      env:
        SINCE: ${{ inputs.since }}
        ADVISORY: ${{ inputs.advisory }}
        ENGINE: ${{ inputs.engine }}
        MODEL: ${{ inputs.model }}
        LLM_API_KEY: ${{ inputs.api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        BOT_LOGIN: ${{ inputs.bot-login }}
        REPOSITORY: ${{ inputs.repository }}
        REPO_PATH: ${{ inputs.path }}
        RUNNER_IMAGE: ${{ inputs.runner-image }}
        DAYBREAK: ${{ inputs.daybreak }}
        OUTPUT_DIR: ${{ steps.reports.outputs.path }}
        REFERENCES: ${{ inputs.references }}
    - name: Store private reports
      if: always() && steps.triage.outcome != 'skipped' && steps.reports.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tamis-reports-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.reports.outputs.path }}
        retention-days: 7
        if-no-files-found: ignore
