name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go tool gotestsum --format github-actions -- -race -count=1 ./...

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - { package: ./internal/report, name: FuzzText }
          - { package: ./internal/report, name: FuzzClues }
          - { package: ./internal/repo, name: FuzzReadFileStaysInTrackedFiles }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ${{ matrix.target.package }} -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime 60s

  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        agent:
          - claude
          - codex
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: docker info
      - run: docker build --target ${{ matrix.agent }} -t tamis-test:${{ matrix.agent }} docker/agent
      - run: go tool gotestsum --format github-actions -- -race -count=1 -tags integration -timeout 8m ./internal/sandbox
        env:
          TAMIS_TEST_IMAGE: tamis-test:${{ matrix.agent }}

