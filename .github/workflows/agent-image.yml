name: Agent image

on:
  push:
    branches: [main]
    paths: ["docker/agent/**", ".github/workflows/agent-image.yml"]
  pull_request:
    paths: ["docker/agent/**", ".github/workflows/agent-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        agent: [claude, codex]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: docker/agent
          target: ${{ matrix.agent }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}-agent:${{ matrix.agent }}
            ghcr.io/${{ github.repository }}-agent:${{ matrix.agent }}-${{ github.sha }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ghcr.io/${{ github.repository }}-agent
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
