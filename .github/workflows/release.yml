name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          for os in linux darwin windows; do
            ext=""
            [ "$os" = windows ] && ext=".exe"
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -trimpath -o "dist/tamis-$os-$arch$ext" ./cmd/tamis
            done
          done
      # The action only runs a released binary attested by this workflow for the commit it was given.
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/tamis-*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/tamis-* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
